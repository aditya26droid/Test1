<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorry My sneha ❤️</title>
  <style>
    body {
      margin: 0;
      font-family: 'Comic Sans MS', cursive;
      background: linear-gradient(to bottom, #ffd6e0, #fff0f5);
      text-align: center;
      color: #ff4d6d;
    }

    .container {
      padding: 20px;
    }

    h1 {
      font-size: 28px;
      margin-top: 20px;
    }

    p {
      font-size: 18px;
      margin: 15px 0;
    }

    .heart {
      font-size: 40px;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .teddy {
      width: 200px;
      margin-top: 20px;
    }

    .btn {
      margin-top: 20px;
      padding: 12px 25px;
      font-size: 16px;
      background: #ff4d6d;
      color: white;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }

    .btn:hover {
      background: #ff1e4d;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>I'm Really Sorry 🥺</h1>
    
    <img class="teddy" src="https://clipart-library.com/images_k/teddy-bear-transparent-background/teddy-bear-transparent-background-6.png" alt="Teddy Bear with Balloon">

    <p>
      I didn’t mean to hurt you 💔<br>
      You mean everything to me ❤️
    </p>

    <div class="heart">❤️</div>

    <button class="btn" onclick="showLove()">Click Me 💕</button>

    <div id="loveMessage" class="hidden">
      <h1>I LOVE YOU SNEHA BABY 😘</h1>
      <p>
        Please forgive me 🥺<br>
        I promise to make you smile :) always 💖
      </p>
    </div>
  </div>

  <script>
    function showLove() {
      document.getElementById("loveMessage").classList.remove("hidden");
    }
  </script>
</body>
</html>
